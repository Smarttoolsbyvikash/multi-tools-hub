<!DOCTYPE html>
<html lang="en">
  
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #000;
      color: #ffcc00;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      font-size: 2rem;
      margin-top: 20px;
      text-shadow: 0 0 10px #ffcc00;
    }
    h2 {
      color: #ccc;
      margin-bottom: 15px;
    }
    .ad-box {
      border: 2px dashed #ffcc00;
      padding: 10px;
      margin: 15px auto;
      width: 85%;
      border-radius: 8px;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 85%;
      margin: 20px auto;
    }
    .tools-grid a {
      display: block;
      background: #111;
      color: #ffcc00;
      border-radius: 12px;
      padding: 14px 0;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
      transition: 0.3s;
    }
    .tools-grid a:hover {
      background: #ffcc00;
      color: #000;
      transform: scale(1.05);
    }

    .add-more {
      display: inline-block;
      margin: 25px auto 20px;
      padding: 12px 30px;
      background: linear-gradient(90deg, #ffcc00, #ff9900);
      color: #000;
      border-radius: 25px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
      transition: 0.3s;
    }
    .add-more:hover {
      background: #000;
      color: #ffcc00;
      border: 2px solid #ffcc00;
      transform: scale(1.08);
    }

    footer {
      color: #ccc;
      font-size: 0.9rem;
      margin: 25px 0;
    }
  </style>
</head>
<body>
  <h1>Smart Multi Tools Hub</h1>
  <h2>by Vikash</h2>

  <div class="ad-box">[Top Ad Placement]</div>

  <div class="tools-grid">
    <a href="tools/pdf-converter.html">📄 PDF Converter</a>
<a href="tools/image-compressor.html">🖼️ Image Compressor</a>
<a href="tools/image-converter.html">🖼️ Image Converter</a>
<a href="tools/image-crop.html">✂️ Image Crop</a>
<a href="tools/password-generator.html">🔐 Password Generator</a>
<a href="tools/emi-calculator.html">📊 EMI Calculator</a>
<a href="tools/sip-calculator.html">📈 SIP Calculator</a>
<a href="tools/age-calculator.html">🎂 Age Calculator</a>
<a href="tools/gst-calculator.html">GST Calculator</a>
<a href="tools/percentage-calculator.html">Percentage Calculator</a>

  </div> 

  </div>

  <!-- Add More Tools Working Button -->
  <a href="tools/more-tools.html" class="add-more">➕ Add More Tools</a>


  <footer>
    💜 Made with ❤️ by Vikash
  </footer>
  <script>
let storedTools = JSON.parse(localStorage.getItem("tools")) || [];
let grid = document.querySelector(".tools-grid");

storedTools.forEach(t=>{
    let a = document.createElement("a");
    a.href = t.link;
    a.innerHTML = `${t.icon} ${t.name}`;
    grid.appendChild(a);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(function() {
      console.log('Service Worker Registered ✅');
    })
    .catch(function(error) {
      console.log('Service Worker Registration Failed ❌', error);
    });
}
</script>

</body>
</html>
