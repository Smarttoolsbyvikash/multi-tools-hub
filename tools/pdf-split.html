<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>PDF Split | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; padding:0; background:#020617; color:#f8fafc; font-family:Arial; }
.container { max-width:850px; margin:auto; padding:20px; }
a.back { color:#facc15; font-size:20px; text-decoration:none; }
h1 { color:#fde047; font-size:28px; margin-top:10px; }

.card {
  background:#0f172a; border-radius:18px; border:1px solid #334155;
  padding:20px; text-align:center; margin-top:20px;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

input {
  width:100%; padding:10px;
  background:#1e293b; color:white;
  border:1px solid #475569; border-radius:10px;
}

button {
  padding:10px 18px; border:none; border-radius:25px;
  cursor:pointer; font-size:14px; font-weight:bold;
}

.convert {
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827; box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.convert:disabled { opacity:0.4; cursor:not-allowed; }

.loader {
  width:50px; height:50px; border-radius:50%;
  border:6px solid rgba(250,204,21,0.2);
  border-top:6px solid #facc15;
  animation:spin 1s linear infinite;
  display:none; margin:15px auto;
}
@keyframes spin { 100% { transform:rotate(360deg);} }

.preview-box {
  background:#1e293b; border-radius:12px; padding:15px;
  border:1px solid #475569; color:#fde68a;
  display:none; margin-top:20px; text-align:left;
}

.footer { text-align:center; color:#64748b; margin-top:30px; }
.footer span { color:#facc15; }
</style>
</head>

<body>

<div class="container">

  <a href="../index.html" class="back">⟵ Back</a>
  <h1>✂ PDF Split</h1>

  <div class="card">

    <input type="file" id="pdfSplit" accept="application/pdf">

    <br><br>

    <input type="text" id="pages" placeholder="Enter page range (e.g. 1-3)">

    <br><br>

    <button class="convert" id="splitBtn" onclick="startSplit()">Split PDF</button>

    <div class="loader" id="loader"></div>

    <div class="preview-box" id="previewBox">
      <h3>📄 File Details</h3>
      <p id="fileInfo"></p>
      <button class="convert" onclick="downloadSplit()">Download Split PDF</button>
    </div>

  </div>

  <div class="footer">Made with <span>❤</span> by Vikash · Smart Multi Tools Hub</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
let splitBlob = null;

async function startSplit() {
  const file = document.getElementById("pdfSplit").files[0];
  const loader = document.getElementById("loader");
  const preview = document.getElementById("previewBox");
  const splitBtn = document.getElementById("splitBtn");
  const range = document.getElementById("pages").value;

  if (!file) return alert("Upload a PDF.");
  if (!range.match(/^\d+-\d+$/)) return alert("Enter valid range. Example: 1-3");

  const [start, end] = range.split("-").map(n => parseInt(n) - 1);

  splitBtn.disabled = true;
  loader.style.display = "block";
  preview.style.display = "none";

  const bytes = await file.arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(bytes);

  const newPdf = await PDFLib.PDFDocument.create();
  const indices = [];

  for (let i = start; i <= end; i++) {
    if (i >= 0 && i < pdfDoc.getPageCount()) indices.push(i);
  }

  const pages = await newPdf.copyPages(pdfDoc, indices);
  pages.forEach(p => newPdf.addPage(p));

  const newBytes = await newPdf.save();
  splitBlob = new Blob([newBytes], { type: "application/pdf" });

  setTimeout(() => {
    loader.style.display = "none";
    preview.style.display = "block";
    document.getElementById("fileInfo").innerHTML = `
      File: <b>${file.name}</b><br>
      Split Pages: ${range}
    `;
    splitBtn.disabled = false;
  }, 1500);
}

function downloadSplit() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(splitBlob);
  a.download = "split.pdf";
  a.click();
}
</script>

</body>
</html>
