<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>CGPA to Percentage | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:0;background:#020617;color:#f8fafc;font-family:Arial;}
.container{max-width:850px;margin:auto;padding:20px;}
a.back{color:#facc15;text-decoration:none;font-size:20px;}
h1{color:#fde047;margin-top:10px;font-size:28px;}

.card{
  background:#0f172a;border-radius:18px;border:1px solid #334155;
  padding:20px;margin-top:20px;text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

label{font-size:13px;color:#cbd5f5;margin-bottom:4px;display:block;text-align:left;}
input,select{
  width:100%;padding:10px;margin-top:8px;border-radius:10px;
  border:1px solid #475569;background:#020617;color:#e5e7eb;
}

button{
  margin-top:15px;padding:10px 18px;border:none;border-radius:25px;
  cursor:pointer;font-size:14px;font-weight:bold;
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827;box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.result{
  margin-top:15px;background:#020617;border:1px solid #475569;
  padding:12px;border-radius:12px;font-size:15px;color:#fde68a;
}

.footer{text-align:center;margin-top:30px;color:#64748b;}
.footer span{color:#facc15;}
</style>
</head>
<body>

<div class="container">

  <a href="../index.html" class="back">⟵ Back</a>
  <h1>🎓 CGPA ➜ Percentage Converter</h1>

  <div class="card">

    <label>Enter your CGPA</label>
    <input type="number" id="cgpa" step="0.01" placeholder="e.g. 8.5">

    <label style="margin-top:15px;">Select Conversion Formula</label>
    <select id="formula">
      <option value="ugc">UGC Formula: (CGPA – 0.5) × 10</option>
      <option value="engg">Engineering Formula: CGPA × 9.5</option>
      <option value="custom">Custom Formula</option>
    </select>

    <div id="customBox" style="display:none;margin-top:12px;">
      <label>Your custom multiplier (e.g. 9.25)</label>
      <input type="number" id="multiplier" step="0.01" placeholder="Enter multiplier">
    </div>

    <button onclick="convert()">Convert</button>

    <div class="result" id="resultBox">Result will appear here…</div>

  </div>

  <div class="footer">Made with <span>❤</span> by Vikash · Smart Multi Tools Hub</div>

</div>

<script>
const formula = document.getElementById("formula");
const customBox = document.getElementById("customBox");

formula.addEventListener("change", ()=>{
  customBox.style.display = formula.value === "custom" ? "block" : "none";
});

function convert(){
  let cg = parseFloat(document.getElementById("cgpa").value);
  if(isNaN(cg) || cg <= 0){
    document.getElementById("resultBox").textContent = "Please enter a valid CGPA.";
    return;
  }

  let per = 0;

  if(formula.value === "ugc"){
    per = (cg - 0.5) * 10;
  }
  else if(formula.value === "engg"){
    per = cg * 9.5;
  }
  else{
    let mul = parseFloat(document.getElementById("multiplier").value);
    if(isNaN(mul) || mul <= 0){
      document.getElementById("resultBox").textContent =
        "Enter a valid custom multiplier.";
      return;
    }
    per = cg * mul;
  }

  document.getElementById("resultBox").textContent =
    "Percentage: " + per.toFixed(2) + "%";
}
</script>

</body>
</html>
