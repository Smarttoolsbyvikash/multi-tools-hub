<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GST Calculator - Smart Tools Hub</title>
<style>
:root{--bg:#0b0e13;--card:#151a22;--pri:#ffcc00;--mut:#9aa1ac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,system-ui}
.wrap{max-width:640px;margin:32px auto;padding:16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:20px}
h1{text-align:center;color:var(--pri);margin:0 0 12px}
label{font-weight:600;margin-bottom:6px;display:block}
input,select,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2a3240;background:#0f131a;color:#fff}
button{background:var(--pri);border:0;font-weight:700;color:#000;cursor:pointer;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.table{margin-top:14px;border:1px solid #2a3240;border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;padding:10px}
.row:nth-child(odd){background:#0f141c}
.footer{text-align:center;margin-top:24px;color:#9aa1ac;font-size:13px}
.ad-slot{text-align:center;margin:14px 0;padding:12px;border:1px dashed #444;border-radius:10px;color:#9aa1ac;font-size:14px}
</style></head><body>

<div class="wrap">
<div class="card">
  <h1>GST Calculator</h1>

  <div class="ad-slot">[Top Ad Placement]</div>

  <label>Mode</label>
  <select id="type">
    <option value="exclusive">Add GST</option>
    <option value="inclusive">Remove GST</option>
  </select>

  <div class="grid">
    <div><label>Amount</label><input id="amt" type="number" min="0" step="0.01" placeholder="e.g. 1000"></div>
    <div><label>GST %</label>
      <select id="rate">
        <option>5</option><option>12</option><option selected>18</option><option>28</option>
      </select>
    </div>
  </div>

  <button onclick="calc()">Calculate</button>

  <div class="table" id="res" style="display:none">
    <div class="row"><b>Base</b><span id="base"></span></div>
    <div class="row"><b>CGST</b><span id="cgst"></span></div>
    <div class="row"><b>SGST</b><span id="sgst"></span></div>
    <div class="row"><b>Total GST</b><span id="tgst"></span></div>
    <div class="row"><b>Grand Total</b><span id="grand"></span></div>
  </div>

 <div class="ad-slot">
  <div id="monetag-ad-10165883"></div>
</div>
<div class="footer">Made with ❤️ by Vikash</div>
</div>

<script>
const ru=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){
  const t=type.value,r=+rate.value,A=+amt.value;
  if(!(A>=0))return;
  let base,cgst,sgst,total,grand;
  if(t==='exclusive'){
    base=A; total=base*r/100; cgst=sgst=total/2; grand=base+total;
  }else{
    base=A/(1+r/100); total=A-base; cgst=sgst=total/2; grand=A;
  }
  base.textContent=ru(base); cgst.textContent=ru(cgst); sgst.textContent=ru(sgst);
  tgst.textContent=ru(total); grand.textContent=ru(grand); res.style.display='block';
}
</script>
</body></html>
