<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://fypf8.com/88/tag.min.js" data-zone="184112" async data-cfasync="false"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <style>
    body {
      background: radial-gradient(circle at center, #1e1e2e, #0b0b13);
      color: #fff;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #ffb400;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ffb400;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 320px;
    }
    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      text-align: center;
    }
    button {
      background-color: #ffb400;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: black;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #ffd65a;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .download-btn {
      margin: 5px;
      background: #00d4ff;
    }
    .ads-box {
      margin-top: 20px;
      width: 90%;
      max-width: 350px;
      background: #111;
      border-radius: 8px;
      padding: 10px;
      color: #bbb;
      font-size: 14px;
      box-shadow: 0 0 8px rgba(255,255,255,0.2);
      text-align: center;
    }
    .ads-box small {
      display: block;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  

  <h1>Password Generator</h1>

  <div class="container">
    <label>Password Length:</label><br>
    <input type="number" id="length" placeholder="e.g. 12" min="4" max="50"><br>

    <label>Include:</label><br>
    <select id="type">
      <option value="letters">Letters Only</option>
      <option value="numbers">Numbers Only</option>
      <option value="symbols">Symbols Only</option>
      <option value="all">All Mix</option>
    </select><br>

    <button onclick="generatePassword()">Generate Password</button>

    <div id="result"></div>

    <button class="download-btn" onclick="downloadPassword('txt')">Download TXT</button>
    <button class="download-btn" onclick="downloadPassword('png')">Download PNG</button>
    <button class="download-btn" onclick="downloadPassword('jpg')">Download JPG</button>
  </div>

 
</div>
  <script>
    function generatePassword() {
      const length = document.getElementById('length').value;
      const type = document.getElementById('type').value;
      let charset = '';

      if (type === 'letters') charset = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      else if (type === 'numbers') charset = '0123456789';
      else if (type === 'symbols') charset = '!@#$%^&*()_+~`|}{[]:;?><,./-=';
      else charset = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=';

      let password = '';
      for (let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }

      document.getElementById('result').textContent = password;
    }

    function downloadPassword(format) {
      const password = document.getElementById('result').textContent;
      if (!password) return alert("Generate a password first!");

      if (format === 'txt') {
        const blob = new Blob([password], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "password.txt";
        link.click();
      } else {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 400;
        canvas.height = 100;
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, 400, 100);
        ctx.fillStyle = "#ffb400";
        ctx.font = "20px Poppins";
        ctx.fillText("Your Password:", 20, 40);
        ctx.fillStyle = "#fff";
        ctx.fillText(password, 20, 70);
        const link = document.createElement("a");
        link.download = `password.${format}`;
        link.href = canvas.toDataURL(`image/${format}`);
        link.click();
      }
    }
  </script>
</body>
</html>
