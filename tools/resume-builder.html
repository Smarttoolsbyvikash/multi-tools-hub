<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script> 
<meta charset="UTF-8">
<title>Resume Builder | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    margin:0; padding:0; background:#020617; color:#f8fafc;
    font-family:Arial, sans-serif;
  }
  .container{
    max-width:1100px; margin:auto; padding:20px;
  }
  a.back{
    color:#facc15; text-decoration:none; font-size:20px;
  }
  h1{
    margin-top:10px; font-size:28px; color:#fde047;
  }
  .layout{
    display:flex; flex-wrap:wrap; gap:20px; margin-top:20px;
  }
  .card{
    background:#0f172a; border-radius:18px; border:1px solid #334155;
    box-shadow:0 12px 35px rgba(0,0,0,0.45); padding:20px; flex:1 1 320px;
  }
  label{
    font-size:13px; color:#cbd5f5; display:block; margin-top:8px;
  }
  input, textarea{
    width:100%; margin-top:4px; padding:8px 10px; border-radius:10px;
    border:1px solid #475569; background:#020617; color:#e5e7eb;
    font-size:13px;
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, textarea:focus{
    outline:none; border-color:#facc15; box-shadow:0 0 6px #facc15;
  }
  button{
    margin-top:12px; padding:10px 18px; border:none; border-radius:25px;
    cursor:pointer; font-size:14px; font-weight:bold;
  }
  .btn-main{
    background:linear-gradient(to right,#facc15,#f97316);
    color:#111827; box-shadow:0 8px 20px rgba(250,204,21,0.5);
  }
  .btn-ghost{
    background:#111827; border:1px solid #475569; color:#e5e7eb;
  }

  /* Resume Preview */
  #resume-preview-wrapper{
    background:#020617; border-radius:18px; border:1px solid #334155;
    padding:12px;
  }
  #resume-preview{
    background:#f9fafb; color:#111827;
    padding:24px; border-radius:12px;
    font-family:Arial, sans-serif;
  }
  .r-header-name{
    font-size:22px; font-weight:bold;
  }
  .r-header-title{
    font-size:14px; color:#4b5563; margin-top:2px;
  }
  .r-contact{
    font-size:11px; color:#4b5563; margin-top:6px;
  }
  .r-section{
    margin-top:14px; font-size:13px;
  }
  .r-section-title{
    font-weight:bold; text-transform:uppercase; font-size:12px;
    border-bottom:1px solid #e5e7eb; padding-bottom:3px; margin-bottom:6px;
  }
  .r-list{
    margin:0; padding-left:18px;
  }
  .r-list li{
    margin-bottom:4px;
  }

  .footer{
    text-align:center; margin-top:30px; color:#64748b; font-size:13px;
  }
  .footer span{ color:#facc15; }
</style>
</head>

<body>
<div class="container">
  <a href="../index.html" class="back">⟵ Back</a>
  <h1>📄 Resume Builder</h1>

  <div class="layout">
    <!-- LEFT: FORM -->
    <div class="card">
      <h3 style="margin-top:0; margin-bottom:10px;">Fill Your Details</h3>

      <label>Full Name</label>
      <input id="name" placeholder="e.g. Vikash Kumar" oninput="updateResume()">

      <label>Job Title</label>
      <input id="title" placeholder="e.g. Full Stack Developer" oninput="updateResume()">

      <label>Email</label>
      <input id="email" placeholder="e.g. you@example.com" oninput="updateResume()">

      <label>Phone</label>
      <input id="phone" placeholder="e.g. +91 9876543210" oninput="updateResume()">

      <label>Address</label>
      <input id="address" placeholder="City, Country" oninput="updateResume()">

      <label>Professional Summary</label>
      <textarea id="summary" placeholder="Short summary about yourself..." oninput="updateResume()"></textarea>

      <label>Skills (comma separated)</label>
      <textarea id="skills" placeholder="HTML, CSS, JavaScript, React" oninput="updateResume()"></textarea>

      <label>Experience (one per line)</label>
      <textarea id="experience" placeholder="Job Title - Company - Duration&#10;Job Title - Company - Duration" oninput="updateResume()"></textarea>

      <label>Education (one per line)</label>
      <textarea id="education" placeholder="Degree - College - Year&#10;Degree - College - Year" oninput="updateResume()"></textarea>

      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <button class="btn-main" onclick="updateResume()">Update Preview</button>
        <button class="btn-ghost" onclick="clearForm()">Clear</button>
      </div>
    </div>

    <!-- RIGHT: PREVIEW -->
    <div class="card">
      <h3 style="margin-top:0; margin-bottom:10px;">Live Preview</h3>
      <div id="resume-preview-wrapper">
        <div id="resume-preview">
          <!-- Filled via JS -->
        </div>
      </div>

      <button class="btn-main" style="width:100%; margin-top:15px;" onclick="downloadPDF()">
        ⬇ Download as PDF
      </button>
    </div>
  </div>

  <div class="footer">
    Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
  </div>
</div>

<!-- html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

<script>
function updateResume() {
  const name = document.getElementById("name").value || "Your Name";
  const title = document.getElementById("title").value || "Your Job Title";
  const email = document.getElementById("email").value || "you@example.com";
  const phone = document.getElementById("phone").value || "+91 0000000000";
  const address = document.getElementById("address").value || "City, Country";
  const summary = document.getElementById("summary").value || "Write a short summary about your experience and skills.";

  const skillsRaw = document.getElementById("skills").value;
  const skills = skillsRaw
    ? skillsRaw.split(",").map(s => s.trim()).filter(Boolean)
    : ["Skill 1", "Skill 2", "Skill 3"];

  const expRaw = document.getElementById("experience").value;
  const experiences = expRaw
    ? expRaw.split("\n").map(s => s.trim()).filter(Boolean)
    : ["Job Title - Company - Duration"];

  const eduRaw = document.getElementById("education").value;
  const educations = eduRaw
    ? eduRaw.split("\n").map(s => s.trim()).filter(Boolean)
    : ["Degree - College - Year"];

  const resume = `
    <div class="r-header">
      <div class="r-header-name">${name}</div>
      <div class="r-header-title">${title}</div>
      <div class="r-contact">
        ${email} | ${phone} | ${address}
      </div>
    </div>

    <div class="r-section">
      <div class="r-section-title">Profile</div>
      <div>${summary.replace(/\n/g, "<br>")}</div>
    </div>

    <div class="r-section">
      <div class="r-section-title">Skills</div>
      <ul class="r-list">
        ${skills.map(s => `<li>${s}</li>`).join("")}
      </ul>
    </div>

    <div class="r-section">
      <div class="r-section-title">Experience</div>
      <ul class="r-list">
        ${experiences.map(e => `<li>${e}</li>`).join("")}
      </ul>
    </div>

    <div class="r-section">
      <div class="r-section-title">Education</div>
      <ul class="r-list">
        ${educations.map(e => `<li>${e}</li>`).join("")}
      </ul>
    </div>
  `;

  document.getElementById("resume-preview").innerHTML = resume;
}

function clearForm(){
  ["name","title","email","phone","address","summary","skills","experience","education"]
    .forEach(id => document.getElementById(id).value = "");
  updateResume();
}

function downloadPDF() {
  const element = document.getElementById("resume-preview");
  const opt = {
    margin:       0.4,
    filename:     'resume.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save();
}

// default fill on first load
updateResume();
</script>

</body>
</html>
