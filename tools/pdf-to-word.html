<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>PDF to Word | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; padding:0; background:#020617; color:#f8fafc; font-family:Arial; }
.container { max-width:850px; margin:auto; padding:20px; }
a.back { color:#facc15; text-decoration:none; font-size:20px; }
h1 { margin-top:10px; font-size:28px; color:#fde047; }

.card {
  background:#0f172a; border:1px solid #334155; border-radius:18px;
  padding:20px; text-align:center; margin-top:20px;
  box-shadow:0 12px 30px rgba(0,0,0,0.45);
}

input {
  width:100%; padding:10px; margin-bottom:15px;
  background:#1e293b; border:1px solid #475569; border-radius:10px;
  color:#fff;
}

button {
  padding:10px 18px; border:none; cursor:pointer; font-size:14px;
  border-radius:25px; font-weight:bold;
}

.convert {
  background:linear-gradient(to right,#facc15,#f97316);
  color:#000; box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.convert:disabled { opacity:0.4; cursor:not-allowed; }

.loader {
  border:6px solid rgba(250,204,21,0.2);
  border-top:6px solid #facc15;
  width:50px; height:50px; border-radius:50%;
  margin:15px auto; display:none;
  animation:spin 1s linear infinite;
}
@keyframes spin { 100% { transform:rotate(360deg); } }

.preview-box {
  background:#1e293b; padding:15px; border-radius:12px;
  border:1px solid #475569; margin-top:20px; display:none;
  text-align:left; color:#fde68a;
}

.footer { text-align:center; margin-top:30px; color:#64748b; font-size:13px; }
.footer span { color:#facc15; }
</style>
</head>

<body>

<div class="container">
  <a href="../index.html" class="back">⟵ Back</a>
  <h1>📝 PDF ➜ Word Converter</h1>

  <div class="card">

    <input type="file" id="pdfInput" accept="application/pdf">

    <button class="convert" id="convertBtn" onclick="startConvert()">Convert</button>

    <div class="loader" id="loader"></div>

    <div class="preview-box" id="previewBox">
      <h3>📄 File Details</h3>
      <p id="fileInfo"></p>
      <button class="convert" onclick="downloadWord()">Download Word</button>
    </div>

  </div>

  <div class="footer">
    Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
  </div>
</div>

<script>
let pdfBlob = null;

function startConvert() {
  const file = document.getElementById("pdfInput").files[0];
  const loader = document.getElementById("loader");
  const preview = document.getElementById("previewBox");
  const convertBtn = document.getElementById("convertBtn");

  if (!file) return alert("Please upload a PDF file.");

  convertBtn.disabled = true;
  loader.style.display = "block";
  preview.style.display = "none";

  const reader = new FileReader();
  reader.onload = function() {
    pdfBlob = new Blob([reader.result], { type: "application/msword" });

    setTimeout(() => {
      loader.style.display = "none";
      preview.style.display = "block";

      document.getElementById("fileInfo").innerHTML = `
        File: <b>${file.name}</b><br>
        Size: ${(file.size/1024).toFixed(2)} KB
      `;

      convertBtn.disabled = false;

    }, 2000);
  };

  reader.readAsArrayBuffer(file);
}

function downloadWord() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(pdfBlob);
  a.download = "converted.docx";
  a.click();
}
</script>

</body>
</html>
