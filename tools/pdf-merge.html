<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>PDF Merge | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; padding:0; background:#020617; color:#f8fafc; font-family:Arial; }
.container { max-width:850px; margin:auto; padding:20px; }
a.back { color:#facc15; text-decoration:none; font-size:20px; }
h1 { margin-top:10px; font-size:28px; color:#fde047; }

.card {
  background:#0f172a; border:1px solid #334155; border-radius:18px; padding:20px;
  margin-top:20px; text-align:center; box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

input {
  background:#1e293b; color:white; border:1px solid #475569;
  border-radius:10px; padding:10px; width:100%; margin-bottom:15px;
}

button {
  padding:10px 18px; border:none; border-radius:25px;
  cursor:pointer; font-size:14px; font-weight:bold;
}

.convert {
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827; box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.convert:disabled { opacity:0.4; cursor:not-allowed; }

/* Yellow loader */
.loader {
  border:6px solid rgba(250,204,21,0.2);
  border-top:6px solid #facc15;
  border-radius:50%; width:50px; height:50px;
  margin:15px auto; animation:spin 1s linear infinite; display:none;
}
@keyframes spin { 100% { transform:rotate(360deg);} }

.preview-box {
  background:#1e293b; padding:15px; border-radius:12px;
  border:1px solid #475569; text-align:left; display:none;
  margin-top:20px; color:#fde68a;
}

.footer { text-align:center; margin-top:30px; color:#64748b; }
.footer span { color:#facc15; }

</style>
</head>

<body>

<div class="container">

  <a href="../index.html" class="back">⟵ Back</a>
  <h1>📚 PDF Merge</h1>

  <div class="card">

    <input type="file" id="mergeFiles" accept="application/pdf" multiple>

    <button class="convert" id="mergeBtn" onclick="startMerge()">Merge PDFs</button>

    <div class="loader" id="loader"></div>

    <div class="preview-box" id="previewBox">
      <h3>📄 Files Loaded</h3>
      <ul id="fileList"></ul>
      <button class="convert" onclick="downloadMerged()">Download Merged PDF</button>
    </div>

  </div>

  <div class="footer">
    Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
let mergedPdfBlob = null;

async function startMerge() {
  const files = document.getElementById("mergeFiles").files;
  const loader = document.getElementById("loader");
  const preview = document.getElementById("previewBox");
  const mergeBtn = document.getElementById("mergeBtn");

  if (!files.length) return alert("Please select PDF files.");

  mergeBtn.disabled = true;
  loader.style.display = "block";
  preview.style.display = "none";

  const pdfDoc = await PDFLib.PDFDocument.create();

  setTimeout(async () => {

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    for (const file of files) {
      const bytes = await file.arrayBuffer();
      const donorPdf = await PDFLib.PDFDocument.load(bytes);

      const copiedPages = await pdfDoc.copyPages(donorPdf, donorPdf.getPageIndices());
      copiedPages.forEach((p) => pdfDoc.addPage(p));

      list.innerHTML += `<li>${file.name}</li>`;
    }

    const mergedPdfBytes = await pdfDoc.save();
    mergedPdfBlob = new Blob([mergedPdfBytes], { type: "application/pdf" });

    loader.style.display = "none";
    preview.style.display = "block";  
    mergeBtn.disabled = false;

  }, 2000);
}

function downloadMerged() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(mergedPdfBlob);
  a.download = "merged.pdf";
  a.click();
}
</script>

</body>
</html>
