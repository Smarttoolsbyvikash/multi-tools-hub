<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>QR Code Generator | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;padding:0;background:#020617;color:#f8fafc;font-family:Arial;}
.container{max-width:850px;margin:auto;padding:20px;}
a.back{color:#facc15;text-decoration:none;font-size:20px;}

h1{color:#fde047;font-size:28px;margin-top:10px;}

.card{
  background:#0f172a;border-radius:18px;border:1px solid #334155;
  padding:20px;margin-top:20px;text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

input,textarea{
  width:100%;padding:10px;border-radius:10px;margin-top:10px;
  background:#020617;color:#e5e7eb;border:1px solid #475569;
}

button{
  margin-top:15px;padding:10px 18px;border:none;border-radius:25px;
  cursor:pointer;font-size:14px;font-weight:bold;
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827;box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.loader{
  width:50px;height:50px;border:6px solid rgba(250,204,21,0.2);
  border-top:6px solid #facc15;border-radius:50%;
  margin:15px auto;animation:spin 1s linear infinite;display:none;
}
@keyframes spin{100%{transform:rotate(360deg);}}

.preview{
  margin-top:20px;display:none;background:#020617;padding:15px;
  border:1px solid #475569;border-radius:12px;
}

.footer{text-align:center;margin-top:30px;color:#64748b;}
.footer span{color:#facc15;}
</style>
</head>

<body>

<div class="container">
  <a href="../index.html" class="back">⟵ Back</a>

  <h1>🔳 QR Code Generator</h1>

  <div class="card">

    <textarea id="qrText" rows="4" placeholder="Enter text or URL..."></textarea>

    <button onclick="generateQR()">Generate QR</button>

    <div class="loader" id="loader"></div>

    <div class="preview" id="previewBox">
      <div id="qrcode"></div>
      <button onclick="downloadQR()">Download PNG</button>
    </div>

  </div>

  <div class="footer">Made with <span>❤</span> by Vikash · Smart Multi Tools Hub</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
let qrDataUrl="";

async function generateQR(){
  const text = document.getElementById("qrText").value;
  const loader = document.getElementById("loader");
  const preview = document.getElementById("previewBox");
  const qrDiv = document.getElementById("qrcode");

  if(!text.trim()){
    alert("Enter some text first.");
    return;
  }

  loader.style.display="block";
  preview.style.display="none";
  qrDiv.innerHTML="";

  setTimeout(async()=>{
    qrDataUrl = await QRCode.toDataURL(text,{width:240});
    const img = document.createElement("img");
    img.src = qrDataUrl;
    qrDiv.appendChild(img);

    loader.style.display="none";
    preview.style.display="block";
  },1200);
}

function downloadQR(){
  const a=document.createElement("a");
  a.href=qrDataUrl;
  a.download="qrcode.png";
  a.click();
}
</script>

</body>
</html>
