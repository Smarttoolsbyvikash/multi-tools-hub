<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>Attendance Calculator | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{margin:0;padding:0;background:#020617;color:#f8fafc;font-family:Arial,sans-serif;}
.container{max-width:850px;margin:auto;padding:20px;}
a.back{color:#facc15;text-decoration:none;font-size:20px;}
h1{margin-top:10px;font-size:28px;color:#fde047;}
.card{
  background:#0f172a;border:1px solid #334155;border-radius:18px;
  padding:20px;margin-top:20px;box-shadow:0 12px 35px rgba(0,0,0,0.45);
}
label{font-size:13px;color:#cbd5f5;margin-bottom:4px;display:block;}
input{
  width:100%;padding:8px 10px;border-radius:10px;
  border:1px solid #475569;background:#020617;color:#e5e7eb;
}
input:focus{outline:none;border-color:#facc15;box-shadow:0 0 6px #facc15;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row > div{flex:1;}
button{
  padding:10px 18px;border:none;border-radius:25px;
  cursor:pointer;font-size:14px;font-weight:bold;
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827;box-shadow:0 8px 20px rgba(250,204,21,0.5);
  margin-top:12px;
}
.result{
  margin-top:12px;font-size:13px;color:#9ca3af;
  padding:10px;border-radius:12px;background:#020617;border:1px solid #475569;
}
.result.good{color:#4ade80;border-color:#4ade80;}
.result.bad{color:#f97373;border-color:#f97373;}
.footer{text-align:center;margin-top:30px;color:#64748b;font-size:13px;}
.footer span{color:#facc15;}
</style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back">⟵ Back</a>
  <h1>📊 Attendance Calculator</h1>

  <div class="card">
    <div class="row">
      <div>
        <label for="total">Total classes</label>
        <input type="number" id="total" placeholder="e.g. 100">
      </div>
      <div>
        <label for="attended">Attended classes</label>
        <input type="number" id="attended" placeholder="e.g. 80">
      </div>
    </div>

    <div style="margin-top:10px;">
      <label for="target">Target % (usually 75)</label>
      <input type="number" id="target" value="75">
    </div>

    <button id="calcBtn">Calculate</button>

    <div id="result" class="result">
      Result yahan show hoga – bunk kar sakte ho ya extra class attend karni padegi.
    </div>
  </div>

  <div class="footer">
    Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
  </div>
</div>

<script>
const totalEl = document.getElementById("total");
const attendedEl = document.getElementById("attended");
const targetEl = document.getElementById("target");
const resultEl = document.getElementById("result");
document.getElementById("calcBtn").addEventListener("click", () => {
  const total = parseInt(totalEl.value,10);
  const attended = parseInt(attendedEl.value,10);
  const target = parseFloat(targetEl.value);

  if(isNaN(total) || isNaN(attended) || isNaN(target) || total<=0 || attended<0){
    resultEl.textContent = "Please enter valid numbers.";
    resultEl.className = "result bad";
    return;
  }

  const current = (attended/total)*100;

  if(current < target){
    // kitni aur classes attend karni hongi
    let extra = 0, t=total, a=attended;
    while((a/(t+1))*100 < target && extra<10000){
      extra++; t++; a++;
    }
    resultEl.textContent =
      `Current attendance: ${current.toFixed(2)}%. Target ${target}% ke liye approx `+
      `${extra} aur classes attend karni padengi (bina bunk kiye).`;
    resultEl.className = "result bad";
  }else{
    // kitne bunk kar sakte ho
    let bunk = 0, t=total, a=attended;
    while((a/(t+1))*100 >= target && bunk<10000){
      bunk++; t++;
    }
    resultEl.textContent =
      `Current attendance: ${current.toFixed(2)}%. Target ${target}% maintain karte hue approx `+
      `${bunk} classes aur bunk kar sakte ho.`;
    resultEl.className = "result good";
  }
});
</script>
</body>
</html>
