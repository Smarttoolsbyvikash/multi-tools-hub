<!DOCTYPE html>
<html lang="en">
<head>
 <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>   
<meta charset="UTF-8">
<title>Word to PDF | Smart Multi Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; padding:0; background:#020617; color:#f8fafc; font-family:Arial; }
.container { max-width:850px; margin:auto; padding:20px; }
a.back { color:#facc15; text-decoration:none; font-size:20px; }
h1 { margin-top:10px; font-size:28px; color:#fde047; }

.card {
  background:#0f172a; border:1px solid #334155; border-radius:18px;
  padding:20px; margin-top:20px; text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

input {
  background:#1e293b; color:white; border:1px solid #475569;
  border-radius:10px; padding:10px; width:100%;
}

button {
  padding:10px 18px; border:none; border-radius:25px;
  cursor:pointer; font-size:14px; font-weight:bold;
}

.convert {
  background:linear-gradient(to right,#facc15,#f97316);
  color:#111827; box-shadow:0 8px 20px rgba(250,204,21,0.5);
}

.convert:disabled { opacity:0.4; cursor:not-allowed; }

.loader {
  border:6px solid rgba(250,204,21,0.2);
  border-top:6px solid #facc15;
  border-radius:50%; width:50px; height:50px;
  margin:15px auto; animation:spin 1s linear infinite; display:none;
}

@keyframes spin { 100% { transform:rotate(360deg); } }

.preview-box {
  background:#1e293b; padding:15px; border-radius:12px;
  border:1px solid #475569; margin-top:20px;
  color:#fde68a; text-align:left; display:none;
}
.footer { text-align:center; margin-top:30px; color:#64748b; font-size:13px; }
.footer span { color:#facc15; }
</style>
</head>

<body>
<div class="container">
  <a href="../index.html" class="back">⟵ Back</a>
  <h1>📄 Word ➜ PDF Converter</h1>

  <div class="card">

    <input type="file" id="wordFile" accept=".txt,.doc,.docx">

    <button class="convert" id="convertBtn" onclick="startConvert()">Convert to PDF</button>

    <div class="loader" id="loader"></div>

    <div class="preview-box" id="previewBox">
      <h3>📄 File Preview</h3>
      <p id="fileInfo"></p>
      <button class="convert" onclick="downloadPDF()">Download PDF</button>
    </div>

  </div>

  <div class="footer">
    Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

<script>
let fileContent = "";

function startConvert() {
  const file = document.getElementById("wordFile").files[0];
  const loader = document.getElementById("loader");
  const preview = document.getElementById("previewBox");
  const convertBtn = document.getElementById("convertBtn");

  if (!file) return alert("Please upload a Word/Text file.");

  loader.style.display = "block";
  convertBtn.disabled = true;
  preview.style.display = "none";

  const reader = new FileReader();

  reader.onload = function(e) {
    fileContent = e.target.result.trim();

    setTimeout(() => {
      loader.style.display = "none";
      preview.style.display = "block";

      document.getElementById("fileInfo").innerHTML = `
        File: <b>${file.name}</b><br>
        Size: ${(file.size/1024).toFixed(2)} KB<br><br>
        <b>Preview:</b><br>
        <div style="white-space:pre-wrap; font-size:13px;">
          ${fileContent.substring(0,200)}...
        </div>
      `;

      convertBtn.disabled = false;
    }, 2000);
  };

  reader.readAsText(file);
}

function downloadPDF() {
  const element = document.createElement("div");
  element.style.padding = "20px";
  element.style.fontSize = "15px";
  element.style.whiteSpace = "pre-wrap";
  element.textContent = fileContent;

  html2pdf().from(element).save("converted.pdf");
}
</script>

</body>
</html>
