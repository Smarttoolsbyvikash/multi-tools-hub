<!DOCTYPE html>
<html lang="en">
<head>
  <script type='text/javascript' src='//pl28051717.effectivegatecpm.com/89/32/cd/8932cdbe41c05959124bb2b9457ace73.js'></script>
    
  <meta charset="UTF-8" />
  <title>Notepad | Smart Multi Tools Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      font-family: Arial, sans-serif;
      color: #f8fafc;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    a.back {
      color: #facc15;
      text-decoration: none;
      font-size: 20px;
    }

    h1 {
      margin-top: 10px;
      font-size: 28px;
      color: #fef9c3;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    }

    textarea {
      width: 100%;
      height: 300px;
      background: #020617;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #facc15;
      box-shadow: 0 0 8px #facc15;
    }

    .stats {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }

    .btns {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
    }

    .download {
      background: linear-gradient(to right, #facc15, #f97316);
      color: #111827;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.5);
    }

    .clear {
      background: #1e293b;
      color: white;
      border: 1px solid #475569;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #64748b;
      font-size: 13px;
    }
    .footer span { color: #facc15; }
  </style>
</head>
<body>

  <div class="container">
    <a href="../index.html" class="back">⟵ Back</a>
    <h1>📝 Notepad</h1>

    <div class="card">
      <textarea id="note" placeholder="Yahan likhna start karo..."></textarea>

      <div class="stats" id="stats">Words: 0 | Characters: 0</div>

      <div class="btns">
        <button class="download" onclick="downloadTxt()">⬇ Download .txt</button>
        <button class="clear" onclick="clearNote()">✖ Clear</button>
      </div>
    </div>

    <div class="footer">
      Made with <span>❤</span> by Vikash · Smart Multi Tools Hub
    </div>
  </div>

<script>
  const note = document.getElementById("note");
  const stats = document.getElementById("stats");

  // Load from localStorage
  note.value = localStorage.getItem("notepad_text") || "";
  updateStats();

  // Auto-save + stats update
  note.addEventListener("input", () => {
    localStorage.setItem("notepad_text", note.value);
    updateStats();
  });

  function updateStats() {
    const text = note.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const chars = note.value.length;

    stats.textContent = `Words: ${words} | Characters: ${chars}`;
  }

  function clearNote() {
    note.value = "";
    localStorage.removeItem("notepad_text");
    updateStats();
  }

  function downloadTxt() {
    const blob = new Blob([note.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "note.txt";
    a.click();

    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
